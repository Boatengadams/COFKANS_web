    <script>
      (() => {
        const MIN_SPLASH_TIME = 300; // shorter minimum for snappier feel
        const MAX_SPLASH_TIME = 3000; // shorter safety fallback
        const EXIT_TIME = 420;
        const startedAt = performance.now();
        let isClosing = false;
        const closeSplash = () => {
          if (isClosing) return;
          isClosing = true;
          const splash = document.getElementById('cofkans-startup-splash');
          if (!splash) return;
          splash.classList.add('is-exiting');
          window.setTimeout(() => splash.remove(), EXIT_TIME);
        };
        window.__cofkansSplashReady = async () => {
          // Wait briefly for fonts to load (avoid FOUC), but don't block too long
          try {
            if (document.fonts && document.fonts.ready) {
              await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 800))]);
            }
          } catch (e) { /* ignore */ }

          const elapsed = performance.now() - startedAt;
          window.setTimeout(closeSplash, Math.max(0, MIN_SPLASH_TIME - elapsed));
        };
        // Fallback: ensure splash never blocks more than MAX_SPLASH_TIME
        window.setTimeout(closeSplash, MAX_SPLASH_TIME);
      })();
    </script>
